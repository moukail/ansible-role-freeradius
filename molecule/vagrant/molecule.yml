---
driver:
  name: vagrant
  provider:
    name: libvirt
  provision: true

platforms:
  #- name: stream10
  #  box: centos/stream10
  #  cpus: 1
  #  memory: 1024
  #  provider_options:
  #    video_type: 'vga'
  - name: stream9
    box: centos/stream10
    cpus: 1
    memory: 1024
    provider_options:
      video_type: 'vga'

dependency:
  name: galaxy
  options:
    #role-file: requirements.yml
    #requirements-file: requirements.yml
    ignore-errors: true
    force: false

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: group_vars

verifier:
  name: ansible

prerun: false

ansible:
  cfg:
    defaults:
      host_key_checking: false
      verbosity: 1
      library: ~/.local/lib/python3.12/site-packages/molecule_plugins/vagrant/modules
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"

