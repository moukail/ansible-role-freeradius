---
- name: Get current version
  ansible.builtin.shell: radiusd -v | cut -f3 -d' ' | head -n2 | tail -n1
  register: current_version
  changed_when: false

- name: Check if radiusd is already installed
  ansible.builtin.debug:
    msg: "Current radiusd version is {{ current_version.stdout }}"

- name: Compile radius from source code
  ansible.builtin.include_tasks: install.yml
  when: current_version.stdout != freeradius_version

- name: Installing clients.conf
  ansible.builtin.template:
    src: clients.conf.j2
    dest: /etc/raddb/clients.conf

- name: backup eap mod
  ansible.builtin.copy:
    src: /etc/raddb/mods-available/eap
    dest: /etc/raddb/mods-available/eap.bkp
    remote_src: yes
    backup: yes

- name: Installing eap.conf
  ansible.builtin.copy:
    src: eap.conf
    dest: /etc/raddb/mods-available/eap

- name: enable eap mod
  ansible.builtin.file:
    src: /etc/raddb/mods-available/eap
    dest: /etc/raddb/mods-enabled/eap
    state: link

- name: backup sql mod
  ansible.builtin.copy:
    src: /etc/raddb/mods-available/sql
    dest: /etc/raddb/mods-available/sql.bkp
    remote_src: yes
    backup: yes

- name: Installing mysql.conf
  ansible.builtin.template:
    src: mysql.conf.j2
    dest: /etc/raddb/mods-available/sql

- name: enable sql mod
  ansible.builtin.file:
    src: /etc/raddb/mods-available/sql
    dest: /etc/raddb/mods-enabled/sql
    state: link

- name: Ensure group "radiusd" exists
  ansible.builtin.group:
    name: radiusd
    state: present

- name: Add the user 'radiusd'
  ansible.builtin.user:
    name: radiusd
    group: radiusd
    create_home: no
    system: yes
    state: present

- include_tasks: mysql.yml

- name: Installing freeRadius init script (service)
  ansible.builtin.template:
    src: radiusd.service.j2
    dest: /etc/systemd/system/radiusd.service

- name: Restart freeRadius
  ansible.builtin.systemd:
    name: radiusd.service
    daemon_reload: yes
    state: restarted
    enabled: yes
